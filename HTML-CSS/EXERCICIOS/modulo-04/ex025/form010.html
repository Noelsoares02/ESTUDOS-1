    <title>Formulário</title>

<body>
    <h1>Formulário de exemplos </h1>

            value="2000" oninput="iidade.innerHTML = 2026 - Number(iano.value)">
        </p>
        <p>
            <label for="iidade">Sua Idade é</label>
            <output id="iidade">o</output>
        </p>
        <p>
            <label for="iidade">Idade é</label>
            <output name="idade" id="iidade">26</output>
        <p>

            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
        <script>
            <function CalcIdade() {
                let atual = new Date();getFullYear()
                iidade.innerHTML =Number(atual) - Number(iano.value)
            }
        </script>
    
</body>
</html>
