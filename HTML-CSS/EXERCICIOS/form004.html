        <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário de Contato</h1>
    <form action="cadastro.php" method="get" autocomplete="on"''>
        <p>
            <label for="imail">E-mail:</label>
            <input type="email" id="imail" name="imail"  autocomplete="imail" required>
        </p>
        <p>
            <label for="itel">Telefone:</label>
            <input type="tel" id="itel" name="itel"  autocomplete="itel" required>
        </p>
        <p>
            <label for="itext">Mensagem:</label>
            <textarea id="itext" name="itext"  autocomplete="itext" required></textarea>      
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
