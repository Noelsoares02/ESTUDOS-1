<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário</h1>
    <form action="cadastro." method="get">
        <p>
            <label for="in1">Número 1</label>
            <input type="number" id="in1" name="in1" min="0" max="50" required
            oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value) + Number(in3.value)">
        </p>
        <p>
            <label for="in2">Número 2</label>
            <input type="number" id="in2" name="in2" min="0" max="50" required
            oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value) + Number(in3.value)">
        </p>
        <p>
            <label for="in3">Número 3</label>
            <input type="number" id="in3" name="in3" min="0" max="50" required
            oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value) + Number(in3.value)">
        </p>
        <p>
            <label for="isoma">Soma</label>
            <output name="soma" id="isoma">0</output>
        </p>
       <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
       </p> 
    </form>

</body>
</html>
