<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexble Box</title>
    <style>
        div.conteiner{
            background-color: lightsalmon;
            display: flex;
            align-items:flex-start;
            flex-wrap: row wrap;
            height: 400px;
        }
        div.item{
            background-color: lightblue ;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
        }
    
    
    div#i1{
        
    }
    div#i2  {
           
        align-self: auto;
    }
    div#i3{
        align-self: self-end;
    }
    div#i4{
        
    }
    div#i5{
        align-self: center;
        }
        
    div#i6{
        
        }
        div#i7{
           align-self: stretch; 
        }
        </style>
<body>
    <div class="conteiner">
        <div class="item" id="i1">AFRKIK</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">CB</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
        
        
    </div>
    </body>
</html>
